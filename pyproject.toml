# pyproject.toml

[tool.poetry]
name = "sleeper-api-wrapper"
packages = [ { include = "sleeper_wrapper" } ]
version = "1.2.3"
description = "A Python API wrapper for Sleeper Fantasy sports, as well as tools to simplify received data."
authors = ["Dan Song, Ford Higgins <py-sleeper-api-wrapper-maintainers@googlegroups.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/dtsong/sleeper-api-wrapper"
repository = "https://github.com/dtsong/sleeper-api-wrapper"
documentation = "https://github.com/dtsong/sleeper-api-wrapper/tree/master/docs"
keywords = ["fantasy football", "fantasy sports", "sports", "sleeper fantasy", "sleeper"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

[tool.poetry.dependencies]
python = ">=3.11, <3.16"
# 2.32.4 fixes CVE-2024-47081. No upper cap below the next major: caps force a release per minor.
requests = ">=2.32.4, <3"
# Direct floor because requests only needs certifi>=2017.4.17.
# 2026.10.19 removes the roots behind the eMudhra intermediate compromise: https://emudhra.we-have-a-problem.com/
certifi = ">=2026.10.19"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-mock = "*"
tox = ">=4.31.0"

[tool.pytest.ini_options]
markers = [
    "network: test makes real HTTPS calls (Sleeper API or TLS trust canary hosts)",
]
